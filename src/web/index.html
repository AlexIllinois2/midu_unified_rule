<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发音规则生成器 (unified_rule)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; max-width: 820px; margin: 20px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; margin-bottom: 12px; }
  fieldset { border: 1px solid #ccc; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  legend { font-weight: bold; padding: 0 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  label { width: 88px; flex: none; font-size: 13px; color: #555; }
  input { flex: 1; min-width: 160px; padding: 7px 9px; border: 1px solid #bbb; border-radius: 6px; font-size: 14px; }
  input:focus { outline: none; border-color: #2a7; }
  .btns { display: flex; gap: 10px; margin-bottom: 14px; }
  button { padding: 9px 18px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .add { background: #2a7; color: #fff; }
  .apply { background: #37f; color: #fff; }
  .push { background: #e83; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .add:hover, .apply:hover, .push:hover { opacity: .9; }
  textarea { width: 100%; height: 320px; font-family: Consolas, "Courier New", monospace; font-size: 13px; padding: 10px; border: 1px solid #bbb; border-radius: 6px; white-space: pre; }
  .tip { font-size: 12px; color: #888; margin: 6px 0 0; }
  .hint { color: #c33; font-size: 12px; min-height: 16px; margin-top: 4px; white-space: pre-wrap; }

  /* 补丁文件状态条 */
  .planbar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555; margin: 0 0 8px; padding: 6px 10px; border-radius: 6px; background: #f4f6f8; transition: background .2s; }
  .planbar.changed { background: #fff3e0; color: #a35b00; font-weight: bold; }
  .planbar.stale { background: #fdecea; color: #c33; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; flex: none; }
  .dot.ok { background: #2a7; }
  .dot.changed { background: #e83; }
  .dot.stale { background: #c33; }

  /* 设备选择弹框 */
  .dlg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .dlg-box { background: #fff; border-radius: 10px; padding: 18px 20px; width: min(420px, 92vw); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .dlg-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
  .dlg-row { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 6px 2px; width: auto; color: #222; }
  .dlg-all { border-bottom: 1px dashed #ddd; margin-bottom: 4px; font-weight: bold; }
  .dlg-btns { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }
  .dlg-cancel { background: #999; color: #fff; }
</style>
</head>
<body>
<h1>发音规则生成器 (unified_rule.txt)</h1>

<fieldset>
  <legend>规则表单</legend>
  <div class="row">
    <label>中文字词(key)</label>
    <input id="key" type="text" placeholder="如：吧 / 巴 / 仁儿 / 小满">
  </div>
  <div class="row">
    <label>读音(pinyin)</label>
    <input id="pinyin" type="text" placeholder="如：ba1 / *5 / renr4 NONE / tangr4 none5 / xiao6 man3">
  </div>
  <div class="row">
    <label>匹配规则</label>
    <select id="rule">
      <option value="TEXT">TEXT（默认）</option>
      <option value="WORD_INSIDE">WORD_INSIDE</option>
      <option value="PINYIN">PINYIN</option>
      <option value="POS">POS</option>
      <option value="__custom__">自定义…</option>
    </select>
    <input id="ruleCustom" type="text" style="display:none" placeholder="输入自定义规则名，如：WORD_INSIDE">
  </div>
  <div class="row">
    <label>匹配值</label>
    <input id="matchval" type="text" value="()" placeholder="留空或 () 时自动使用中文字词完整值，如：(吧)台 / .*(区)老师">
  </div>
  <div class="row">
    <label>注释(可选)</label>
    <input id="comment" type="text" placeholder="默认空，如：关键词出现的时候，最后一个字轻声">
  </div>
  <div class="hint" id="hint"></div>
</fieldset>

<div class="btns">
  <button class="add" id="btnAdd">添加</button>
  <button class="apply" id="btnApply">应用</button>
  <button class="push" id="btnPush">推送</button>
</div>

<div class="planbar" id="planbar">
  <span class="dot" id="planDot"></span>
  <span id="planText">正在读取 conf/rule_patch.txt …</span>
</div>

<textarea id="output" spellcheck="false" placeholder="生成的规则将显示在这里（每行一条，Tab 分隔）…"></textarea>
<p class="tip">生成格式：<code>key&nbsp;⇥&nbsp;读音&nbsp;⇥&nbsp;规则(匹配值)&nbsp;[⇥&nbsp;# 注释]</code>。应用 = 写入 rule_patch.txt 新增区块并整理；推送 = adb 推送 unified_rule.txt 并强制重启 app。</p>

<script type="module" src="./js/app.js"></script>
</body>
</html>
